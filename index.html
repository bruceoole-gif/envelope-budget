<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Envelope</title>
<meta name="description" content="Envelope budgeting for irregular income — essentials first, then percentage folders.">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="app-shell">
    <header id="topbar">
      <span class="brand">Envelope</span>
      <button id="profile-btn" class="profile-btn" aria-label="Account">?</button>
    </header>

    <nav id="nav" hidden></nav>

    <main id="view-root" tabindex="-1"></main>

    <button id="fab-add" aria-label="Quick add">+</button>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <div id="lock-screen" hidden>
    <div class="lock-content">
      <h1>Envelope</h1>
      <p class="muted" data-lock-subtitle>Enter your PIN</p>
      <button type="button" class="btn btn-primary" data-biometric-btn hidden>Use biometrics</button>
      <form>
        <input type="password" inputmode="numeric" name="pin" autocomplete="off">
        <p class="lock-error text-negative" role="alert"></p>
        <button type="submit" class="btn btn-primary">Unlock</button>
      </form>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
